name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Since 0.99.190 the engine lives in src/GunWall.Core. Uploading a release by
      # copying files over the repository adds and replaces but never deletes, so
      # the old copies can stay in src/GunWall and the build then fails with
      # "already contains a definition for ...". Say that plainly instead.
      - name: Check for files left over from an older upload
        shell: pwsh
        run: |
          $allowed = @(
            'src/GunWall/Services/IconService.cs',
            'src/GunWall/Models/DisplayRows.cs',
            'src/GunWall/Models/RangeObservableCollection.cs'
          )
          $stale = @(Get-ChildItem -Path src/GunWall/Services, src/GunWall/Models -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName).Replace('\', '/') } |
            Where-Object { $allowed -notcontains $_ })
          if ($stale.Count -gt 0) {
            foreach ($f in $stale) { Write-Host "::error file=$f::Left over from an older version - this file now lives in src/GunWall.Core. Delete it from the repository." }
            exit 1
          }
          Write-Host 'No leftover engine files in the window project.'

      - name: Restore
        run: dotnet restore GunWall.sln

      - name: Build (Release, x64)
        run: dotnet build GunWall.sln --configuration Release --no-restore /p:Platform=x64

      - name: Publish single-file EXE (needs the .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/GunWall/GunWall.csproj
          --configuration Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GunWall-win-x64
          path: publish/
          if-no-files-found: warn
